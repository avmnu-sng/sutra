name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install shellcheck and PyYAML if missing
        run: |
          if ! command -v shellcheck >/dev/null 2>&1 || ! python3 -I -c 'import yaml' >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck python3-yaml
          fi

      - name: Run scripts/check.sh
        run: bash scripts/check.sh

  # The hook must run under bash 3.2, and only macOS ships it, as /bin/bash.
  hook-tests-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run tests/hooks.sh with the hook under /bin/bash 3.2
        run: |
          /bin/bash -c 'echo "/bin/bash is $BASH_VERSION"; [ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2 ]' || { echo "expected bash 3.2 at /bin/bash"; exit 1; }
          BASH_UNDER_TEST=/bin/bash bash tests/hooks.sh

  # claude plugin validate needs no login, so this job needs no secret.
  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dependabot bumps only the actions, so bump this by hand, and raise
      # the Node floor in "Install Claude Code" if its engines.node rises.
      CLAUDE_CODE_VERSION: "2.1.319"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          node --version
          node -e 'process.exit(parseInt(process.versions.node, 10) >= 22 ? 0 : 1)' || { echo "Claude Code $CLAUDE_CODE_VERSION needs Node 22 or newer"; exit 1; }
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/claude" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          echo "$RUNNER_TEMP/claude/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Confirm the pinned CLI version
        run: |
          claude --version
          [ "$(claude --version | cut -d ' ' -f 1)" = "$CLAUDE_CODE_VERSION" ]

      - name: Validate the marketplace
        run: claude plugin validate --strict .

      - name: Validate the plugin against the directory profile
        run: claude plugin validate --strict --profile directory plugins/sutra
